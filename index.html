<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Creativo - Laura</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { font-size: 2.2rem; margin-top: 20px; margin-bottom: 20px; text-align: center; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        nav button { background: transparent; color: #aaaaaa; border: 1px solid #333; font-size: 1.1rem; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; }
        nav button:hover, nav button.active { color: #ffffff; border-color: #ffffff; background-color: #111; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .intro-container { display: flex; gap: 40px; max-width: 1000px; margin: 0 auto; align-items: center; }
        .intro-image { flex: 1; max-width: 400px; }
        .intro-image img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); }
        .intro-text { flex: 1.5; font-size: 1.1rem; line-height: 1.8; color: #dddddd; }
        
        /* Galleria aggiornata con layout Masonry per rispettare le proporzioni reali */
        .gallery { max-width: 1200px; margin: 0 auto; }
        .gallery-grid { column-count: 3; column-gap: 15px; }
        @media (max-width: 800px) { .gallery-grid { column-count: 2; } }
        @media (max-width: 500px) { .gallery-grid { column-count: 1; } .intro-container { flex-direction: column; text-align: center; } nav { flex-direction: column; } }
        
        .artwork { 
            display: inline-block; 
            width: 100%; 
            margin-bottom: 15px; 
            break-inside: avoid; 
            background: #111; 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05); 
        }
        .artwork a { display: block; width: 100%; text-decoration: none; }
        .artwork img { 
            width: 100%; 
            height: auto; 
            display: block; 
            transition: transform 0.2s ease, opacity 0.2s ease; 
        }
        .artwork img:hover { transform: scale(1.02); opacity: 0.9; }
        
        .caption { padding: 10px; font-size: 0.85rem; color: #aaaaaa; text-align: center; }
        .title { color: #ffffff; font-weight: bold; }
        .details { font-style: italic; display: block; margin-top: 4px; font-size: 0.8rem; }
        footer { margin-top: 60px; text-align: center; font-size: 0.85rem; color: #666666; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
